<!DOCTYPE html>
<html>

<head>

    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>

    <script
        src="https://unpkg.com/aframe-environment-component@1.5.x/dist/aframe-environment-component.min.js"></script>

    <script>
        function getPokemon(dexNum, pokemon, changeText) {
            const apiUrl = `https://pokeapi.co/api/v2/pokemon/${dexNum}`;
            fetch(apiUrl)
                .then(response => {
                    if (!response.ok) {
                        throw new Error("Not found");
                    }
                    return response.json();
                })
                .then(data => {
                    const sprite = data.sprites.front_default;
                    let name = data.name.toUpperCase().replace("-", " ");

                    if (changeText) {
                        document.querySelector('#pokemon-name').setAttribute('value', `Last Pokemon Caught: ${name}`);
                    }
                    else {
                        pokemon.setAttribute('material', 'src', sprite);
                    }
                })
                .catch(error => {
                    document.querySelector('#pokemon-name').setAttribute('value', 'Last Pokemon Caught: MISSINGNO.');
                })
        }
    </script>
    <script>
        AFRAME.registerComponent('face-camera-y', {
            init: function () {
                this.camPos = new THREE.Vector3();
            },
            tick: function () {
                this.el.sceneEl.camera.getWorldPosition(this.camPos);
                const pos = this.el.object3D.position;
                this.el.object3D.lookAt(this.camPos.x, pos.y, this.camPos.z);
            }
        });

        AFRAME.registerComponent('pokemon-route', {
            init: function () {
                this.scoreText = document.querySelector('#pokemon-name');

                setInterval(() => {
                    let pokemon = document.createElement('a-plane');
                    let dexNumber = Math.floor(Math.random() * 1025) + 1;
                    let pokemonName = "";

                    let x = (Math.random() * 12) - 6; // Spawns left to right
                    let y = (Math.random() * 2) + 1;  // Spawns at different heights
                    let z = -(Math.random() * 5) - 1; //Spawns closer and further to player

                    pokemon.dexNum = dexNumber;
                    pokemon.setAttribute('material', 'transparent: true; alphaTest: 0.5');
                    getPokemon(dexNumber, pokemon);
                    pokemon.setAttribute('position', `${x} ${y} ${z}`);
                    pokemon.classList.add('pokemon'); // Marks it as shootable
                    pokemon.setAttribute('shader', 'flat');
                    pokemon.setAttribute('dithering', false);
                    pokemon.setAttribute('face-camera-y', '');

                    this.el.sceneEl.appendChild(pokemon);

                    // Auto-despawn so the browser doesn't crash
                    setTimeout(() => { if (pokemon.parentNode) pokemon.remove() }, 4000);
                }, 1500);

                window.addEventListener('mousedown', () => {
                    document.querySelector('#pokeball').emit('catch');

                    let raycaster = document.querySelector('[raycaster]').components.raycaster;
                    let hits = raycaster.intersectedEls;

                    if (hits.length > 0 && hits[0].classList.contains('pokemon')) {
                        const caught = hits[0];
                        setTimeout(() => caught.remove(), 100);  // Destroy target
                        getPokemon(caught.dexNum, undefined, true);
                    }
                });
            }
        });
    </script>
</head>

<body>
    <a-scene pokemon-route>

        <a-entity environment="preset: yavapai; skyType: atmosphere; lighting: none"></a-entity>

        <a-light type="ambient" color="#222"></a-light>

        <a-light type="directional" position="-1 2 1" intensity="1.5"></a-light>

        <a-camera id="main-camera" look-controls="pointerLockEnabled: false">

            <a-text id="pokemon-name" value="Last Pokemon Caught: MISSINGNO." position="-1.1 0.6 -1" color="#FFF"
                width="3"></a-text>

            <a-entity cursor raycaster="objects: .pokemon; far: 50" position="0 0 -1"
                geometry="primitive: ring; radiusInner: 0.01; radiusOuter: 0.02"
                material="color: gray; shader: flat; opacity: 0.7">
            </a-entity>
            <a-sphere id="pokeball" radius="0.1" color="red" position="0.3 -0.3 -0.5" animation__catch="property: position; 
                from: 0.3 -0.3 -0.5;
                to: 0 0 -15; 
                dur: 800; 
                easing: linear; 
                autoplay: false; 
                startEvents: catch;"></a-sphere>
        </a-camera>


    </a-scene>
</body>

</html>
