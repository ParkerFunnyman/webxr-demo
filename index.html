<!DOCTYPE html>
<html>
  <head>
    
      <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    
    <script src="https://unpkg.com/aframe-environment-component@1.3.3/dist/aframe-environment-component.min.js"></script>
    
  </head>
  <body>
    <a-scene>
      <a-entity environment="preset: forest; skyType: atmosphere; lighting: none"></a-entity>
      <a-light type="ambient" color="#222"></a-light>
      <a-light type="directional" position="-1 2 1" intensity="1.5"></a-light>
      <a-sphere id="pokeball" radius="0.1" color="#FFF" position="0 1 -2"></a-sphere>
    </a-scene>
  </body>
</html>
