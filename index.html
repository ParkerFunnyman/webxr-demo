<!DOCTYPE html>
<html>

<head>

    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>

    <script src="https://unpkg.com/aframe-environment-component@1.5.x/dist/aframe-environment-component.min.js"></script>

</head>

<body>
    <a-scene>
        <a-entity environment="preset: yavapai; skyType: atmosphere; lighting: none"></a-entity>
        <a-light type="ambient" color="#222"></a-light>
        <a-light type="directional" position="-1 2 1" intensity="1.5"></a-light>
        <a-camera look-controls="pointerLockEnabled: false">
            <a-text id="pokeinfo" value="Last Caught Pokemon: MISSING NO." position="-1.1 0.6 -1" color="#FFF" width="3"></a-text>
        </a-camera>
        <a-sphere id="pokeball" radius="0.1" color="#FFF" position="0 1 -2"></a-sphere>
        <a-plane src="https://i.redd.it/yebfa2gpb0se1.png" position="0 1 -5"></a-plane>
    </a-scene>
</body>

</html>
